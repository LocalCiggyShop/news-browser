name: Verify extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 scripts/build.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: news-browser-packages
          path: dist/news-browser-*.zip
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-check-artifacts
          path: artifacts/
